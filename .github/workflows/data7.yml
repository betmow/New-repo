name: fetch-data-v7
on:
  workflow_dispatch:
    inputs:
      parts:
        description: "probe | klines,premium,metrics,funding,depth,liq,misc | bookticker | hist  (comma list)"
        default: "probe"
      syms:
        description: "symbols"
        default: "BTCUSDT,ETHUSDT"
      start:
        description: "first month of 1m history (YYYY-MM)"
        default: "2022-06"
      bt_from:
        description: "first day for bookTicker (YYYY-MM-DD, blank = last 30 days)"
        default: ""
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip requests pandas numpy
      - run: python fetch_data_v7.py
        env:
          PARTS: ${{ github.event.inputs.parts }}
          SYMS: ${{ github.event.inputs.syms }}
          START: ${{ github.event.inputs.start }}
          BT_FROM: ${{ github.event.inputs.bt_from }}
      - name: save results
        if: always()
        run: |
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data7
          git commit -m "update data7" || echo "nothing to commit"
          git pull --rebase -q || true
          git push || true
